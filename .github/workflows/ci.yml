# CI for every push to a non-default branch. Job names ("tests", "build") are stable on purpose:
# the status is read back through the GitHub API (check runs), so do not rename them.
name: CI

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint and JSON validity
        run: |
          git ls-files -z '*.php' | xargs -0 -n1 php -l
          python3 -m json.tool site.webmanifest > /dev/null

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static site - entry page present (nothing to build)
        run: |
          test -f index.html
